<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ============================================================
   ⚠️ REPLACE THIS LINE with your Google Apps Script Web App URL
   ============================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyOCSXRwNaVlm0d20-f7pimDcrHLSiv9CiVZmh3C-tdQuPVXYL0YlUXr0G0qEuXlU_R/exec';

/* ============================================================
   ROBUST apiGet / apiPost
   ============================================================ */
async function apiGet(action, params) {
  const qs = new URLSearchParams({ action, ...(params || {}) }).toString();
  const res = await fetch(SCRIPT_URL + "?" + qs + "&t=" + Date.now(), {
    method: "GET",
    redirect: "follow"
  });
  return await res.json();
}

async function apiPost(payload) {
  const body = JSON.stringify(payload);

  /* Attempt 1 — standard fetch (reads JSON if possible) */
  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: body,
      redirect: "follow"
    });
    if (res.ok) {
      const text = await res.text();
      try { return JSON.parse(text); }
      catch { /* fall through to attempt 2 */ }
    }
  } catch (err) {
    console.warn("apiPost attempt 1 failed:", err.message);
  }

  /* Attempt 2 — no-cors fire-and-forget (still reaches server) */
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: body
    });
    return { result: "queued", message: "Sent (no-cors fallback)" };
  } catch (err2) {
    console.error("apiPost attempt 2 failed:", err2.message);
    return { result: "error", message: err2.message };
  }
}

function LoginScreen({ onLogin }) {
  const [mode, setMode] = useState("admin");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    setError("");
    if (!username.trim() || !password.trim()) { setError("Please enter both username and password."); return; }
    if (mode === "admin") {
      if (username === DEFAULT_ADMIN.username && password === DEFAULT_ADMIN.password) onLogin({ role: "admin", name: "Administrator", username });
      else setError("Invalid admin credentials.");
    } else {
      if (username === DEFAULT_USER.username && password === DEFAULT_USER.password) onLogin({ role: "user", name: username, username });
      else setError("Invalid user credentials.");
    }
  };

  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={handleSubmit}>
        <div className="brand-logo">JSPM</div>
        <h1>Activity Report System</h1>
        <div className="subtitle">Jayawantrao Sawant Polytechnic</div>
        <div className="login-tabs">
          <button type="button" className={mode === "admin" ? "active" : ""} onClick={() => { setMode("admin"); setError(""); }}>🔐 Admin</button>
          <button type="button" className={mode === "user" ? "active" : ""} onClick={() => { setMode("user"); setError(""); }}>👤 User</button>
        </div>
        <label>Username</label>
        <input value={username} onChange={e => setUsername(e.target.value)} placeholder={mode === "admin" ? "Enter admin username" : "Enter user username"} autoComplete="username" />
        <label>Password</label>
        <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Enter password" autoComplete="current-password" />
        <div className="login-error">{error}</div>
        <button type="submit" className="login-btn">{mode === "admin" ? "Login as Admin" : "Login as User"}</button>
      </form>
    </div>
  );
}

// ============================================================
// WORD EXPORT (immediate download)
// ============================================================
function exportToWord(reportEl, subject) {
  const html = buildWordHtml(reportEl);
  const blob = new Blob(['\ufeff', html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Activity_Report_${subject.replace(/\s+/g, '_')}.doc`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ============================================================
// BUILD WORD-COMPATIBLE HTML
// ============================================================
function buildWordHtml(reportEl) {
  if (!reportEl) return "";
  const clone = reportEl.cloneNode(true);

  const letterhead = clone.querySelector(".letterhead");
  if (letterhead) {
    const leftBox  = letterhead.querySelector(".logo-box:first-child")?.innerHTML || "";
    const rightBox = letterhead.querySelector(".logo-box:last-child")?.innerHTML || "";
    const info     = letterhead.querySelector(".college-info")?.innerHTML || "";
    letterhead.innerHTML = `<table style="width:100%;border-collapse:collapse"><tr><td style="width:100px;text-align:center;vertical-align:middle">${leftBox}</td><td style="text-align:center;vertical-align:middle;padding:0 12px">${info}</td><td style="width:100px;text-align:center;vertical-align:middle">${rightBox}</td></tr></table>`;
  }

  clone.querySelectorAll(".photo-frame").forEach((frame, index) => {
    const img = frame.querySelector("img");
    if (img && img.src && img.src.startsWith("data:")) {
      frame.innerHTML = `<img src="${img.src}" width="320" height="300" style="width:320px;height:300px;border:1px solid #000;" />`;
      frame.setAttribute("style", "width:340px;height:320px;text-align:center;vertical-align:middle;border:1px solid #000;padding:0;margin:8px;display:inline-block;");

      frame.innerHTML = `<span style="font-size:11pt;color:#666;">Photo ${index + 1}</span>`;
      frame.setAttribute("style", "width:340px;height:320px;text-align:center;vertical-align:middle;border:1px solid #000;padding:0;margin:8px;display:inline-block;");

  const photosGrid = clone.querySelector(".photos-grid");

  const sigBlock = clone.querySelector(".signature-block");
  if (sigBlock) {
    sigBlock.innerHTML = `<table style="width:100%;border-collapse:collapse;margin-top:60px"><tr><td style="width:33.33%;text-align:center;vertical-align:top;font-size:11pt;padding:20px 10px 0 10px"><b>Coordinator</b></td><td style="width:33.33%;text-align:center;vertical-align:top;font-size:11pt;padding:20px 10px 0 10px"><b>HOD</b></td><td style="width:33.33%;text-align:center;vertical-align:top;font-size:11pt;padding:20px 10px 0 10px"><b>Principal</b></td></tr></table>`;
  }

  const content = clone.innerHTML;

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Activity Report</title>
  <style>
    @page { size: 21cm 29.7cm; margin: 1.2cm 1.5cm 1.2cm 1.5cm; mso-page-orientation: portrait; }
    body { font-family: 'Times New Roman', serif; font-size: 10.5pt; line-height: 1.35; color: #000; margin:0; padding:0; }
    .letterhead { border-bottom: 3px double #000; padding-bottom: 8px; margin-bottom: 10px; }
    .letterhead table { width: 100%; border-collapse: collapse; }
    .letterhead td { vertical-align: middle; }
    .letterhead .logo-box img { max-width: 85px; max-height: 85px; }
    .letterhead .jspm-tag { font-size: 10pt; font-weight: bold; margin: 0 0 1px; font-style: italic; text-align: center; }
    .letterhead .college-name-single { font-size: 15pt; font-weight: bold; margin: 0 0 1px; text-align: center; }
    .letterhead .college-city { font-size: 11pt; font-weight: bold; margin: 0 0 2px; text-align: center; }
    .letterhead .department { font-size: 10.5pt; font-weight: bold; margin: 0 0 3px; text-align: center; }
    .letterhead .report-tag { font-size: 10pt; font-weight: bold; margin: 0; text-align: center; text-transform: uppercase; text-decoration: underline; }
    h1.doc-title { text-align: center; font-size: 12pt; font-weight: bold; text-decoration: underline; margin: 0 0 8px; }
    .info-table { width: 100%; border-collapse: collapse; font-size: 10pt; margin-bottom: 8px; border: 1px solid #000; }

// ============================================================
// REPORT EDITOR
// ============================================================
function ReportEditor({ session, onLogout, initialData, initialPhotos, initialPoData, onSave, initialDriveId }) {
  const [data, setData] = useState(initialData || defaultData);
  const [photos, setPhotos] = useState(initialPhotos || [null, null, null, null]);
  const [poData, setPoData] = useState(initialPoData || defaultPoData);
  const [leftLogo, setLeftLogo] = useState(DEFAULT_LEFT_LOGO);
  const [rightLogo, setRightLogo] = useState(DEFAULT_RIGHT_LOGO);
  const [leftCustom, setLeftCustom] = useState(false);
  const [rightCustom, setRightCustom] = useState(false);
  const [saved, setSaved] = useState(false);
  const [savingToDrive, setSavingToDrive] = useState(false);
  const [connStatus, setConnStatus] = useState("");
  const printAreaRef = useRef(null);

  const update = (key, val) => setData(prev => ({ ...prev, [key]: val }));
  const updatePO = (key, val) => setPoData(prev => ({ ...prev, [key]: val }));

  const handlePhoto = (index, file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => { const copy = [...photos]; copy[index] = e.target.result; setPhotos(copy); };
    reader.readAsDataURL(file);
  };

  const handleLogoUpload = (side, file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      if (side === "left") { setLeftLogo(e.target.result); setLeftCustom(true); }
      else { setRightLogo(e.target.result); setRightCustom(true); }
    };
    reader.readAsDataURL(file);
  };

  const resetLeftLogo = () => { setLeftLogo(DEFAULT_LEFT_LOGO); setLeftCustom(false); };
  const resetRightLogo = () => { setRightLogo(DEFAULT_RIGHT_LOGO); setRightCustom(false); };

  const handleReset = () => {
    if (!confirm("Clear all form data?")) return;
    setData(defaultData);
    setPhotos([null, null, null, null]);
    setPoData(defaultPoData);
    setLeftLogo(DEFAULT_LEFT_LOGO);
    setRightLogo(DEFAULT_RIGHT_LOGO);
    setLeftCustom(false);
    setRightCustom(false);
  };

  const testConnection = async () => {
    setConnStatus("Testing...");
    try {
      const r = await apiGet("ping");
      if (r && r.result === "success") setConnStatus("✅ Connected: " + r.message);
      else setConnStatus("⚠ " + (r.message || "unknown response"));
    } catch (e) {
      setConnStatus("❌ " + e.message);
    }
    setTimeout(() => setConnStatus(""), 5000);
  };

  const handleSaveReport = async () => {
    if (!data.subject.trim()) { alert("Please enter Name of Subject."); return; }

    /* 1) Local save */
    onSave({ data, photos, poData, leftLogo, rightLogo, createdBy: session.name || session.username });

    /* 2) Push to Drive */
    setSavingToDrive(true);
    try {
      const html = buildWordHtml(printAreaRef.current);
      const reportId = initialDriveId || ("rpt_" + Date.now() + "_" + Math.random().toString(36).slice(2,7));

      const payload = {
        action: "saveReport",
        id: reportId,
        subject: data.subject,
        createdBy: session.name || session.username,
        wordHtml: html,
        pdfHtml: html,
        photosBase64: photos.filter(Boolean)
      };

      const r = await apiPost(payload);

      /* Case A — full success */
      if (r && r.result === "success") {
        setSaved(true);
        setTimeout(() => setSaved(false), 2500);
        alert(
          "✓ Report saved locally and to Google Drive.\n\n" +
          "Word: " + r.wordUrl + "\n" +
          "PDF: " + (r.pdfUrl || "(PDF generation failed)") + "\n" +
          "Photos: " + r.photosCount
        );
        return;
      }

      /* Case B — no-cors fallback: verify by re-listing */
      if (r && (r.result === "queued" || r.result === "unknown")) {
        await new Promise(res => setTimeout(res, 2500));
        try {
          const check = await apiGet("listFolders");
          if (check.result === "success") {
            const found = check.folders.find(f => f.name.startsWith(data.subject.substring(0, 60)));
            if (found) {
              setSaved(true);
              setTimeout(() => setSaved(false), 2500);
              alert(
                "✓ Report saved to Google Drive.\n\n" +
                "Folder: " + found.name + "\n" +
                "Word: " + (found.wordUrl || "(pending)") + "\n" +
                "PDF: " + (found.pdfUrl || "(pending)") + "\n" +
                "Photos: " + (found.photosCount || 0)
              );
              return;
            }
          }
        } catch (e) { console.warn("Verification failed:", e); }

        alert("⚠ Save was sent but could not be verified.\n\nPlease check Drive folder 'JSPM_Activity_Reports' manually.");
        return;
      }

      /* Case C — explicit error */
      alert("⚠ Saved locally. Drive upload failed: " + (r.message || "unknown"));
    } catch (err) {
      console.error(err);
      alert(
        "⚠ Saved locally. Drive upload failed: " + err.message + "\n\n" +
        "Check that:\n" +
        "1. SCRIPT_URL is your real /exec URL\n" +
        "2. Apps Script is deployed with 'Who has access: Anyone'\n" +
        "3. Test in browser: <SCRIPT_URL>?action=ping"
      );
    } finally {
      setSavingToDrive(false);
    }
  };

  const handlePrint = () => {
    const originalTitle = document.title;
    document.title = `Activity_Report_${data.subject.replace(/\s+/g,"_")}`;
    setTimeout(() => {
      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1500);
    }, 150);
  };

  const handlePDF = handlePrint;

  const handleWord = () => {
    if (printAreaRef.current) exportToWord(printAreaRef.current, data.subject);
  };

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="user-info">
          <div className="name">👤 {session.name || session.username}</div>
          <div className="role">{session.role === "admin" ? "Administrator" : "User"}</div>
          <div className="logout" onClick={onLogout}>Logout</div>
        </div>

        <button className="green" onClick={handleSaveReport} disabled={savingToDrive}>
          {savingToDrive ? "⏳ Saving to Drive..." : "💾 Save Report"}
        </button>
        {saved && <div style={{color:"#4ade80",fontSize:"12px",marginTop:"6px",textAlign:"center",fontFamily:"Arial"}}>✓ Report saved!</div>}

        <button className="gray" onClick={testConnection}>🔌 Test Connection</button>
        {connStatus && (
          <div className={`conn-status ${connStatus.startsWith("✅") ? "ok" : connStatus.startsWith("❌") ? "err" : ""}`}
               style={!connStatus.startsWith("✅") && !connStatus.startsWith("❌") ? {display:"block",background:"#334155",color:"#cbd5e1",border:"1px solid #475569"} : {}}>
            {connStatus}
          </div>
        )}

        <h2 style={{ marginTop: "20px" }}>🏫 Letterhead Logos</h2>

        <div className="logo-section">
          <h3>◀ LEFT SIDE LOGO</h3>
          {leftLogo && <div className="logo-preview"><img src={leftLogo} alt="Left logo"
            onError={(e) => { e.target.src = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3"/><text x="40" y="42" font-size="9" text-anchor="middle" fill="#64748b">logo1.png</text></svg>'); }} /></div>}
          <div className="upload-slot"><input type="file" accept="image/*" onChange={e => handleLogoUpload("left", e.target.files[0])} /></div>
          {leftCustom && <button className="small" onClick={resetLeftLogo}>↻ Restore Default Left Logo</button>}
        </div>

        <div className="logo-section">
          <h3>▶ RIGHT SIDE LOGO</h3>
          {rightLogo && <div className="logo-preview"><img src={rightLogo} alt="Right logo"
            onError={(e) => { e.target.src = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3"/><text x="40" y="42" font-size="9" text-anchor="middle" fill="#64748b">logo2.png</text></svg>'); }} /></div>}
          <div className="upload-slot"><input type="file" accept="image/*" onChange={e => handleLogoUpload("right", e.target.files[0])} /></div>
          {rightCustom && <button className="small" onClick={resetRightLogo}>↻ Restore Default Right Logo</button>}
        </div>

        <h2 style={{ marginTop: "20px" }}>📝 Report Details</h2>
        <label>Academic Year</label><input value={data.academicYear} onChange={e => update("academicYear", e.target.value)} />
        <label>Name of Program</label><input value={data.program} onChange={e => update("program", e.target.value)} />
        <label>Class & Division</label><input value={data.classDivision} onChange={e => update("classDivision", e.target.value)} />
        <label>Name of Activity</label><input value={data.activity} onChange={e => update("activity", e.target.value)} />
        <label>Activity Coordinator</label><input value={data.activityCoordinator} onChange={e => update("activityCoordinator", e.target.value)} />
        <label>Student Coordinator</label><input value={data.studentCoordinator} onChange={e => update("studentCoordinator", e.target.value)} />
        <label>Expert / Guest / Industry</label><textarea value={data.expert} onChange={e => update("expert", e.target.value)} />
        <label>Name of Subject</label><input value={data.subject} onChange={e => update("subject", e.target.value)} />
        <label>Date of Conduction</label><input value={data.date} onChange={e => update("date", e.target.value)} />
        <label>Total Beneficiaries</label><input value={data.beneficiaries} onChange={e => update("beneficiaries", e.target.value)} />
        <label>CO</label><input value={data.co} onChange={e => update("co", e.target.value)} />
        <label>PO</label><input value={data.po} onChange={e => update("po", e.target.value)} />
        <label>PSO</label><input value={data.pso} onChange={e => update("pso", e.target.value)} />
        <label>Activity Report</label><textarea rows="8" value={data.report} onChange={e => update("report", e.target.value)} />

        <h2 style={{ marginTop: "25px" }}>🎯 PO & PSO Explanations</h2>
        <p style={{ fontSize: "11px", color: "#94a3b8", margin: "4px 0 12px", fontFamily:"Arial" }}>
          Fill explanation only for POs/PSOs addressed. <strong>Blank ones won't appear.</strong>
        </p>
        <h3 style={{ color: "#60a5fa", fontSize: "13px", margin: "15px 0 8px", fontFamily: "Arial" }}>Program Outcomes (POs)</h3>
        {Object.entries(PO_PSO_DEFINITIONS).filter(([key]) => key.startsWith("po")).map(([key, item]) => (
          <div key={key} className="po-block">
            <p className="po-code">{item.code}</p>
            <p className="po-title">{item.title}</p>
            <p className="po-desc">{item.desc}</p>
            <textarea placeholder={`Explain how ${item.code} was achieved...`} value={poData[key]} onChange={e => updatePO(key, e.target.value)} rows="2" />
          </div>
        ))}
        <h3 style={{ color: "#a78bfa", fontSize: "13px", margin: "15px 0 8px", fontFamily: "Arial" }}>Program Specific Outcomes (PSOs)</h3>
        {Object.entries(PO_PSO_DEFINITIONS).filter(([key]) => key.startsWith("pso")).map(([key, item]) => (
          <div key={key} className="po-block pso">
            <p className="po-code">{item.code}</p>
            <p className="po-title">{item.title}</p>
            <p className="po-desc">{item.desc}</p>
            <textarea placeholder={`Explain how ${item.code} was achieved...`} value={poData[key]} onChange={e => updatePO(key, e.target.value)} rows="2" />
          </div>
        ))}

        <h2 style={{ marginTop: "25px" }}>📷 Photos (4)</h2>
        {[0, 1, 2, 3].map(i => (
          <div key={i}>
            <label>Photo {i + 1}</label>
            <div className="upload-slot"><input type="file" accept="image/*" onChange={e => handlePhoto(i, e.target.files[0])} /></div>
          </div>
        ))}

        <button onClick={handlePrint}>🖨️ Print Report</button>
        <button className="green" onClick={handleWord}>📄 Download as Word (.doc)</button>
        <button className="blue" onClick={handlePDF}>📕 Download as PDF</button>
        <button className="gray" onClick={handleReset}>♻️ Reset Form</button>
      </aside>

      <main className="main">
        <div className="toolbar no-print">
          <h1>📘 Activity Report Preview</h1>
        </div>
        <div className="print-area" ref={printAreaRef}>
          <ReportPage data={data} photos={photos} poData={poData} leftLogo={leftLogo} rightLogo={rightLogo} />
        </div>
      </main>
    </div>
  );
}

// ============================================================
// VIEW REPORT MODAL
// ============================================================
function ViewReportModal({ report, onClose }) {
  const printRef = useRef(null);

  const handlePrint = () => {
    const originalTitle = document.title;
    document.title = `Activity_Report_${report.data.subject.replace(/\s+/g,"_")}`;
    setTimeout(() => {
      window.print();
      setTimeout(() => { document.title = originalTitle; }, 1500);
    }, 150);
  };

  const handlePDF = handlePrint;

  const handleWord = () => {
    if (printRef.current) exportToWord(printRef.current, report.data.subject);
  };

  return (
    <div className="modal-overlay">
      <div className="modal-content">
        <button className="modal-close no-print" onClick={onClose}>✕</button>
        <div className="modal-actions no-print">
          <h3>📄 {report.data.subject || "Activity Report"}</h3>
          <button style={{background:"#2563eb",color:"#fff"}} onClick={handlePrint}>🖨 Print</button>
          <button style={{background:"#dc2626",color:"#fff"}} onClick={handlePDF}>📕 Save PDF</button>
          <button style={{background:"#16a34a",color:"#fff"}} onClick={handleWord}>📄 Save Word</button>
        </div>
        <div className="modal-body">
          <div className="print-area" ref={printRef}>
            <ReportPage
              data={report.data}
              photos={report.photos}
              poData={report.poData}
              leftLogo={report.leftLogo || DEFAULT_LEFT_LOGO}
              rightLogo={report.rightLogo || DEFAULT_RIGHT_LOGO}
            />
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// DRIVE IMPORT MODAL
// ============================================================
function DriveImportModal({ onClose, onImported }) {
  const [folders, setFolders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [search, setSearch] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const r = await apiGet("listFolders");
        if (r.result === "success") setFolders(r.folders || []);
        else setError(r.message || "Failed to load folders");
      } catch (e) { setError(e.message); }
      finally { setLoading(false); }
    })();
  }, []);

  const filtered = folders.filter(f =>
    (f.name || "").toLowerCase().includes(search.toLowerCase())
  );

  const handleImport = async (folder) => {
    try {
      const r = await apiPost({ action: "importReport", folderId: folder.id });
      if (r.result === "success") {
        onImported({
          folderId: folder.id,
          name: folder.name,
          bodyHtml: r.bodyHtml,
          subject: r.subject,
          wordUrl: folder.wordUrl,
          pdfUrl: folder.pdfUrl
        });
      } else {
        alert("Import failed: " + (r.message || "unknown"));
      }
    } catch (err) {
      alert("Import failed: " + err.message);
    }
  };

  return (
    <div className="modal-overlay">
      <div className="modal-content" style={{maxWidth:"800px"}}>
        <button className="modal-close no-print" onClick={onClose}>✕</button>
        <div className="modal-actions no-print">
          <h3>📥 Import Report from Google Drive</h3>
          <input type="text" placeholder="Search folders..." value={search}
            onChange={e => setSearch(e.target.value)}
            style={{padding:"8px 12px",border:"1px solid #cbd5e1",borderRadius:"6px",fontSize:"13px",width:"220px"}} />
        </div>
        <div className="modal-body" style={{background:"#fff",minHeight:"300px"}}>
          {loading && <p style={{textAlign:"center",color:"#64748b"}}>Loading folders from Google Drive...</p>}
          {error && <p style={{color:"#dc2626"}}>{error}</p>}
          {!loading && !error && filtered.length === 0 && (
            <p style={{textAlign:"center",color:"#94a3b8"}}>No report folders found in Drive.</p>
          )}
          {!loading && filtered.length > 0 && (
            <table style={{width:"100%",borderCollapse:"collapse",fontFamily:"Arial",fontSize:"13px"}}>
              <thead>
                <tr style={{background:"#f1f5f9"}}>
                  <th style={{textAlign:"left",padding:"10px"}}>Folder</th>
                  <th style={{textAlign:"left",padding:"10px"}}>Photos</th>
                  <th style={{textAlign:"left",padding:"10px"}}>Files</th>
                  <th style={{textAlign:"left",padding:"10px"}}>Action</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(f => (
                  <tr key={f.id} style={{borderBottom:"1px solid #e2e8f0"}}>
                    <td style={{padding:"10px"}}><strong>{f.name}</strong></td>
                    <td style={{padding:"10px"}}>{f.photosCount || 0}</td>
                    <td style={{padding:"10px"}}>
                      {f.wordUrl && <a href={f.wordUrl} target="_blank" rel="noreferrer" style={{marginRight:"8px"}}>📄 Word</a>}
                      {f.pdfUrl && <a href={f.pdfUrl} target="_blank" rel="noreferrer">📕 PDF</a>}
                    </td>
                    <td style={{padding:"10px"}}>
                      <button onClick={() => handleImport(f)}
                        style={{background:"#2563eb",color:"#fff",border:"0",padding:"6px 12px",borderRadius:"5px",cursor:"pointer",fontWeight:"bold",fontSize:"12px"}}>
                        Import
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [session, setSession] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [reports, setReports] = useState([]);
  const [editingReport, setEditingReport] = useState(null);
  const [viewingReport, setViewingReport] = useState(null);
  const [showImport, setShowImport] = useState(false);

  useEffect(() => { setReports(loadReports()); }, []);
  const reload = () => setReports(loadReports());

  const handleLogin = (s) => {
    setSession(s);
    setPage(s.role === "admin" ? "dashboard" : "editor");
  };

  const handleLogout = () => {
    setSession(null); setPage("dashboard");
    setEditingReport(null); setViewingReport(null); setShowImport(false);
  };

  const handleSaveReport = (payload) => {
    const all = loadReports();
    if (editingReport) {
      const idx = all.findIndex(r => r.id === editingReport.id);
      if (idx !== -1) {
        all[idx] = { ...all[idx], data: payload.data, photos: payload.photos, poData: payload.poData, leftLogo: payload.leftLogo, rightLogo: payload.rightLogo, updatedAt: new Date().toISOString() };
      }
      setEditingReport(null);
      saveReports(all);
      reload();
      setPage("dashboard");
    } else {
      const newReport = {
        id: "rpt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        data: payload.data, photos: payload.photos, poData: payload.poData,
        leftLogo: payload.leftLogo, rightLogo: payload.rightLogo,
        createdBy: payload.createdBy || (session ? session.username : "unknown"),
        createdAt: new Date().toISOString(), updatedAt: null
      };
      all.push(newReport);
      saveReports(all);
      reload();
      if (session && session.role === "admin") setPage("dashboard");
    }
  };

  const handleDelete = (report) => {
    if (!confirm(`Delete report "${report.data.subject}"? This cannot be undone.`)) return;
    saveReports(loadReports().filter(r => r.id !== report.id));
    reload();
  };

  const handleEdit = (report) => { setEditingReport(report); setPage("editor"); };
  const handleView = (report) => setViewingReport(report);
  const handleNewReport = () => { setEditingReport(null); setPage("editor"); };

  const handleImportReport = (payload) => {
    const imported = {
      id: "imp_" + Date.now(),
      data: {
        ...defaultData,
        subject: payload.subject || "Imported Report",
        report: payload.bodyHtml || ""
      },
      photos: [null, null, null, null],
      poData: defaultPoData,
      leftLogo: DEFAULT_LEFT_LOGO,
      rightLogo: DEFAULT_RIGHT_LOGO,
      createdBy: session ? session.username : "unknown",
      createdAt: new Date().toISOString(),
      __driveId: payload.folderId
    };
    setEditingReport(imported);
    setPage("editor");
    setShowImport(false);
  };

  if (!session) return <LoginScreen onLogin={handleLogin} />;

  if (page === "editor") {
    return (
      <>
        <ReportEditor
          session={session}
          onLogout={handleLogout}
          initialData={editingReport ? editingReport.data : undefined}
          initialPhotos={editingReport ? editingReport.photos : undefined}
          initialPoData={editingReport ? editingReport.poData : undefined}
          initialDriveId={editingReport ? editingReport.__driveId : undefined}
          onSave={handleSaveReport}
        />
        {session.role === "admin" && (
          <button className="no-print" onClick={() => { setEditingReport(null); setPage("dashboard"); }}
            style={{position:"fixed",bottom:"20px",right:"20px",background:"#172033",color:"#fff",border:"0",padding:"12px 20px",borderRadius:"30px",fontWeight:"bold",cursor:"pointer",boxShadow:"0 6px 20px rgba(0,0,0,0.3)",fontFamily:"Arial",fontSize:"13px",zIndex:200}}>
            ← Back to Dashboard
          </button>
        )}
      </>
    );
  }

  if (session.role === "admin") {
    return (
      <>
        <div className="admin-header no-print">
          <div><strong>🔐 JSPM Admin Panel</strong></div>
          <div>
            <span style={{marginRight:"16px",color:"#cbd5e1"}}>👤 {session.name}</span>
            <button onClick={handleLogout} style={{background:"#dc2626",color:"#fff",border:"0",padding:"6px 14px",borderRadius:"6px",cursor:"pointer",fontWeight:"bold",fontSize:"12px",fontFamily:"Arial"}}>Logout</button>
          </div>
        </div>
        <div style={{paddingTop:"60px"}}>
          <AdminDashboard
            reports={reports}
            onView={handleView}
            onEdit={handleEdit}
            onDelete={handleDelete}
            onNew={handleNewReport}
            onRefresh={reload}
            onImport={() => setShowImport(true)}
          />
        </div>
        {viewingReport && <ViewReportModal report={viewingReport} onClose={() => setViewingReport(null)} />}
        {showImport && <DriveImportModal onClose={() => setShowImport(false)} onImported={handleImportReport} />}
      </>
    );
  }

  return <LoginScreen onLogin={handleLogin} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
