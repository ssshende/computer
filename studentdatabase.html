<script>
/* ============================================================
   ⚠️ REPLACE THIS LINE with your Google Apps Script Web App URL
   ============================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwynzOIRXs8FakClESf_PMp8_7MhNeM4IUmj_H8_0I7-8tesbCBZqKdrN5KXJM-nPU-/exec';

const DEFAULT_ADMIN_USERNAME = "admin";
const DEFAULT_ADMIN_PASSWORD = "Admin@123";

let adminCredentials = { username: DEFAULT_ADMIN_USERNAME, password: DEFAULT_ADMIN_PASSWORD };

const defaultForm = {
  academicYear:"", rollNo:"", enrollmentNo:"", firstName:"", middleName:"", lastName:"",
  gender:"", studentCategory:"", birthDate:"", studentContact:"", parentsContact:"",
  motherContact:"", email:"", bloodGroup:"", className:"",
  currentAddress:"", permanentAddress:"", photo:""
};

const FIELD_LABELS = {
  academicYear:"Academic Year", rollNo:"Roll No", enrollmentNo:"Enrollment No",
  firstName:"First Name", middleName:"Middle Name", lastName:"Last Name",
  gender:"Gender", studentCategory:"Students Category", birthDate:"Birth Date",
  studentContact:"Student Contact Number", parentsContact:"Parents Contact Number",
  motherContact:"Mother's Contact Number", email:"Email", bloodGroup:"Blood Group",
  className:"Class", currentAddress:"Current Address", permanentAddress:"Permanent Address",
  photo:"Student Photo"
};

const CLASSES = ["FYCO1","FYCO2","FYCO3","SYCO1","SYCO2","SYCO3","TYCO1","TYCO2","TYCO3"];
const CATEGORIES = ["SC","ST","SEBC","Open","OBC","NT1","NT2","NT3","VJNT","Other"];
const BLOOD_GROUPS = ["A+","A-","B+","B-","AB+","AB-","O+","O-"];

/* Academic Years: 2026-27 → 2050-51 */
const YEARS = (() => {
  const arr = [];
  for (let y = 2026; y <= 2050; y++) {
    const end = (y + 1) % 100;
    arr.push(y + "-" + String(end).padStart(2, "0"));
  }
  return arr;
})();

let students = [];
let dataLoaded = false;
let session = null;
let page = "dashboard";
let loginRole = "student";
let editIndex = null;
let toastTimer = null;

/* ============ API ============ */
async function apiGet(action) {
  const res = await fetch(SCRIPT_URL + "?action=" + action + "&t=" + Date.now());
  return await res.json();
}
async function apiPost(payload) {
  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    console.log("apiPost response:", data);
    return data;
  } catch (err) {
    console.error("apiPost error:", err);
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
    } catch (e2) { console.error("Fallback failed:", e2); }
    return { result: "unknown" };
  }
}
async function loadStudentsFromSheet() {
  try {
    const data = await apiGet("getAll");
    if (data.result === "success" && Array.isArray(data.students)) students = data.students;
  } catch (e) { console.error("Load students failed:", e); }
  dataLoaded = true;
}
async function loadCredentialsFromSheet() {
  try {
    const data = await apiGet("getCredentials");
    if (data.result === "success" && data.credentials) adminCredentials = data.credentials;
  } catch (e) { console.error("Load credentials failed:", e); }
}

/* ============ UTILS ============ */
function esc(v){return String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}
function showToast(msg){clearTimeout(toastTimer);let d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);toastTimer=setTimeout(()=>d.remove(),2600)}
function getField(id){return document.getElementById(id)?.value.trim()||""}

function formatDateDMY(v){
  if(!v) return "";
  const s = String(v).trim();
  if(!s) return "";
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3] + "/" + m[2] + "/" + m[1];
  const d = new Date(s);
  if(!isNaN(d.getTime())){
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yyyy = d.getFullYear();
    return dd + "/" + mm + "/" + yyyy;
  }
  return s;
}

/* ============ LOGIN ============ */
function loginScreen(){
  document.getElementById("root").innerHTML=`
  <div class="login-screen">
    <div class="login-card">
      <div class="brand-logo">JS</div>
      <h1>Jayawantrao Sawant Polytechnic</h1>
      <div class="subtitle">Computer Engineering Student Database</div>
      <div class="role-buttons">
        <button class="role-btn ${loginRole==="admin"?"active":""}" onclick="setRole('admin')">🔐 Admin</button>
        <button class="role-btn ${loginRole==="student"?"active":""}" onclick="setRole('student')">📝 Student</button>
      </div>
      ${loginRole==="admin"?`
        <label>Admin Username</label>
        <input id="username" type="text" autocomplete="off" placeholder="Enter Admin username">
        <label>Admin Password</label>
        <input id="password" type="password" autocomplete="off" placeholder="Enter Admin password">
        <div id="loginError" class="login-error"></div>
        <button id="loginBtn" class="btn btn-primary" style="width:100%" onclick="login()">Admin Login</button>
      `:`
        <div class="student-only-note">Students do not need Admin credentials. Select Student and continue to the Student Form.</div>
        <label>Enrollment No <span style="color:#d00">*</span></label>
        <input id="studentIdentity" type="text" placeholder="Enter your Enrollment No" required autocomplete="off">
        <div id="loginError" class="login-error"></div>
        <button class="btn btn-success" style="width:100%" onclick="login()">Open Student Form</button>
      `}
    </div>
  </div>`;
}
function setRole(role){loginRole=role;loginScreen()}

async function login(){
  if(loginRole==="admin"){
    const u=document.getElementById("username").value.trim();
    const p=document.getElementById("password").value;
    const btn=document.getElementById("loginBtn");
    const err=document.getElementById("loginError");
    btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Checking...'; err.textContent='';
    await loadCredentialsFromSheet();
    if(u===adminCredentials.username && p===adminCredentials.password){
      session={role:"admin"}; page="dashboard";
      btn.innerHTML='<span class="spinner"></span>Loading data...';
      await loadStudentsFromSheet(); render(); return;
    }
    err.textContent="Invalid Admin username or password.";
    btn.disabled=false; btn.textContent="Admin Login"; return;
  }
  const id=document.getElementById("studentIdentity").value.trim();
  if(!id){ document.getElementById("loginError").textContent="Enrollment No is mandatory. Please enter your Enrollment No."; return; }
  session={role:"student",identity:id}; page="studentForm";
  if(!dataLoaded) await loadStudentsFromSheet();
  render();
}
function logout(){session=null;page="dashboard";loginRole="student";editIndex=null;loginScreen()}
function render(){ if(!session){loginScreen();return} if(session.role==="admin"){adminApp();return} studentApp(); }

function dashboardPage(){

 const female=students.filter(s=>s.gender==="Female").length;
 const email=students.filter(s=>s.email).length;
 const contact=students.filter(s=>s.studentContact).length;
 return `<div class="dashboard-grid">
  ${stat("Total Students",students.length,"👥")}
  ${stat("Complete Information",students.filter(s=>s.firstName&&s.lastName&&s.email&&s.studentContact).length,"✓")}

  ${stat("Female Students",female,"♀")}

  ${stat("With Contact Number",contact,"☎")}
 </div>

/* ============ PHOTO HANDLING (Crop / No-Crop modes) ============ */
function pickPhoto(mode){
  const input = document.getElementById("f_photo");
  const modeEl = document.getElementById("photoMode");
  if(modeEl) modeEl.value = mode;
  input.value = "";        /* allow re-selecting the same file */
  input.click();
}

function handlePhotoUpload(event){
  const file = event.target.files[0];
  if(!file) return;

  if(file.size > 2 * 1024 * 1024){
    alert("Photo size must be less than 2 MB. Please choose a smaller image.");
    event.target.value = "";
    return;
  }
  if(!file.type.startsWith("image/")){
    alert("Please select a valid image file (JPG, PNG, etc.).");
    event.target.value = "";
    return;
  }

  const mode = document.getElementById("photoMode")?.value || "crop";

  const reader = new FileReader();
  reader.onload = function(e){
    const dataUrl = e.target.result;
    if(mode === "nocrop"){
      autoSquarePhoto(dataUrl);       /* skip crop modal */
    } else {
      openCropModal(dataUrl);         /* open crop tool */
    }
  };
  reader.readAsDataURL(file);
}

/* Auto-crop to square without showing the crop modal (fit-to-fill) */
function autoSquarePhoto(dataUrl){
  const img = new Image();
  img.onload = function(){
    const OUT = 500;
    const out = document.createElement("canvas");
    out.width = OUT;
    out.height = OUT;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, OUT, OUT);

    const scale = Math.max(OUT / img.width, OUT / img.height);
    const dispW = img.width * scale;
    const dispH = img.height * scale;
    const dx = (OUT - dispW) / 2;
    const dy = (OUT - dispH) / 2;

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, dx, dy, dispW, dispH);

    const croppedDataUrl = out.toDataURL("image/jpeg", 0.9);

    document.getElementById("photoImg").src = croppedDataUrl;
    document.getElementById("photoImg").style.display = "block";
    document.getElementById("photoPlaceholder").style.display = "none";
    document.getElementById("f_photo_data").value = croppedDataUrl;

    showToast("Photo added (auto square).");
  };
  img.onerror = function(){
    alert("Could not load the image. Please try another file.");
  };
  img.src = dataUrl;
}

/* ============ PHOTO CROP MODAL ============ */
let cropState = {
  img: null,
  baseScale: 1,
  zoom: 1,
  minZoom: 1,
  maxZoom: 5,
  offsetX: 0,
  offsetY: 0,
  dragging: false,
  startX: 0,
  startY: 0,
  stageSize: 380
};

function openCropModal(dataUrl){
  const img = new Image();
  img.onload = function(){
    cropState.img = img;
    cropState.zoom = 1;
    cropState.offsetX = 0;
    cropState.offsetY = 0;

    const stage = document.getElementById("cropStage");
    const size = stage.clientWidth || 380;
    cropState.stageSize = size;

    cropState.baseScale = Math.max(size / img.width, size / img.height);

    cropSyncControls();
    document.getElementById("cropOverlay").classList.add("show");

    setupCropInteraction();
    drawCrop();
  };
  img.onerror = function(){
    alert("Could not load the image. Please try another file.");
  };
  img.src = dataUrl;
}

function closeCropModal(){
  document.getElementById("cropOverlay").classList.remove("show");
  cropState.img = null;
  cropState.dragging = false;
}

function cropSetZoom(z){
  if(!cropState.img) return;
  z = parseFloat(z);
  if(isNaN(z)) return;
  z = Math.max(cropState.minZoom, Math.min(cropState.maxZoom, z));
  cropState.zoom = z;
  clampOffset();
  drawCrop();
  cropSyncControls();
}

function cropZoomStep(delta){
  cropSetZoom(cropState.zoom + delta);
}

function cropReset(){
  cropState.zoom = 1;
  cropState.offsetX = 0;
  cropState.offsetY = 0;
  clampOffset();
  drawCrop();
  cropSyncControls();
}

function cropSyncControls(){
  const slider = document.getElementById("cropZoom");
  const label  = document.getElementById("cropZoomLabel");
  const btnOut = document.getElementById("cropZoomOut");
  const btnIn  = document.getElementById("cropZoomIn");

  if(slider) slider.value = cropState.zoom;
  if(label)  label.textContent = Math.round(cropState.zoom * 100) + "%";
  if(btnOut) btnOut.disabled = cropState.zoom <= cropState.minZoom + 0.001;
  if(btnIn)  btnIn.disabled  = cropState.zoom >= cropState.maxZoom - 0.001;
}

function setupCropInteraction(){
  const stage = document.getElementById("cropStage");
  const fresh = stage.cloneNode(true);
  stage.parentNode.replaceChild(fresh, stage);

  fresh.addEventListener("pointerdown", (e) => {
    if(!cropState.img) return;
    cropState.dragging = true;
    cropState.startX = e.clientX - cropState.offsetX;
    cropState.startY = e.clientY - cropState.offsetY;
    try { fresh.setPointerCapture(e.pointerId); } catch(_) {}
  });

  fresh.addEventListener("pointermove", (e) => {
    if(!cropState.dragging) return;
    cropState.offsetX = e.clientX - cropState.startX;
    cropState.offsetY = e.clientY - cropState.startY;
    clampOffset();
    drawCrop();
  });

  fresh.addEventListener("pointerup", (e) => {
    cropState.dragging = false;
    try { fresh.releasePointerCapture(e.pointerId); } catch(_) {}
  });

  fresh.addEventListener("pointercancel", () => { cropState.dragging = false; });

  fresh.addEventListener("wheel", (e) => {
    if(!cropState.img) return;
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.1 : -0.1;
    cropZoomStep(delta);
  }, { passive: false });
}

function clampOffset(){
  if(!cropState.img) return;
  const size = cropState.stageSize;
  const scale = cropState.baseScale * cropState.zoom;
  const dispW = cropState.img.width * scale;
  const dispH = cropState.img.height * scale;
  const maxX = Math.max(0, (dispW - size) / 2);
  const maxY = Math.max(0, (dispH - size) / 2);
  cropState.offsetX = Math.max(-maxX, Math.min(maxX, cropState.offsetX));
  cropState.offsetY = Math.max(-maxY, Math.min(maxY, cropState.offsetY));
}

function drawCrop(){
  if(!cropState.img) return;
  const canvas = document.getElementById("cropCanvas");
  const size = cropState.stageSize;
  const dpr = window.devicePixelRatio || 1;

  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + "px";
  canvas.style.height = size + "px";

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);

  const scale = cropState.baseScale * cropState.zoom;
  const dispW = cropState.img.width * scale;
  const dispH = cropState.img.height * scale;
  const x = (size - dispW) / 2 + cropState.offsetX;
  const y = (size - dispH) / 2 + cropState.offsetY;

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(cropState.img, x, y, dispW, dispH);
}

function applyCrop(){
  if(!cropState.img){ closeCropModal(); return; }

  const size = cropState.stageSize;
  const frameRatio = 0.48;
  const cropSize = size * frameRatio;
  const frameLeft = (size - cropSize) / 2;
  const frameTop  = (size - cropSize) / 2;

  const scale = cropState.baseScale * cropState.zoom;
  const dispW = cropState.img.width * scale;
  const dispH = cropState.img.height * scale;
  const imgLeft = (size - dispW) / 2 + cropState.offsetX;
  const imgTop  = (size - dispH) / 2 + cropState.offsetY;

  const sx = (frameLeft - imgLeft) / scale;
  const sy = (frameTop  - imgTop)  / scale;
  const sw = cropSize / scale;
  const sh = cropSize / scale;

  const OUT = 500;
  const out = document.createElement("canvas");
  out.width = OUT;
  out.height = OUT;
  const octx = out.getContext("2d");
  octx.fillStyle = "#ffffff";
  octx.fillRect(0, 0, OUT, OUT);

  try {
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = "high";
    octx.drawImage(cropState.img, sx, sy, sw, sh, 0, 0, OUT, OUT);
  } catch(err){
    console.error("Crop render failed:", err);
    alert("Could not crop the image. Please try a different photo.");
    return;
  }

  const croppedDataUrl = out.toDataURL("image/jpeg", 0.9);

  document.getElementById("photoImg").src = croppedDataUrl;
  document.getElementById("photoImg").style.display = "block";
  document.getElementById("photoPlaceholder").style.display = "none";
  document.getElementById("f_photo_data").value = croppedDataUrl;

  closeCropModal();
  showToast("Photo cropped successfully.");
}

/* ============ FORM POPULATE / READ ============ */
function populateForm(){
  if(editIndex===null) return;
  const s=students[editIndex];
  if(!s) return;
  Object.keys(defaultForm).forEach(k=>{
    if(k === "photo") return;
    const el=document.getElementById("f_"+k);
    if(el) el.value=s[k]||"";
  });
  if(s.photo){
    document.getElementById("photoImg").src = s.photo;
    document.getElementById("photoImg").style.display = "block";
    document.getElementById("photoPlaceholder").style.display = "none";
    document.getElementById("f_photo_data").value = s.photo;
  } else {
    resetPhotoUI();
  }
  clearValidation();
}
function cancelEdit(){ editIndex=null; go("database"); }
function readForm(){
  let o={};
  Object.keys(defaultForm).forEach(k=>{
    if(k === "photo") return;
    o[k]=getField("f_"+k);
  });
  o.photo = document.getElementById("f_photo_data")?.value || "";
  return o;
}
function clearValidation(){
  const banner = document.getElementById("validationBanner");
  if (banner) { banner.className = "validation-banner"; banner.innerHTML = ""; }
  document.querySelectorAll(".field.has-error").forEach(el => el.classList.remove("has-error"));
}

async function submitForm(e,mode){
 e.preventDefault();
 clearValidation();
 const s = readForm();

 const missing = [];
 Object.keys(FIELD_LABELS).forEach(k => {
   if (k === "photo") {
     if (!s.photo || !s.photo.trim()) missing.push({ key: "photo", label: FIELD_LABELS.photo });
     return;
   }
   if (!s[k] || !String(s[k]).trim()) missing.push({ key: k, label: FIELD_LABELS[k] });
 });
 if (missing.length > 0) { showValidationErrors(missing, "Please fill in all required fields:"); return; }

 const errors = [];
 if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email))
   errors.push({ key:"email", label:"Email", reason:"Invalid email format (e.g. name@example.com)" });
 const phoneRegex = /^[0-9+\-\s()]{6,20}$/;
 if (!phoneRegex.test(s.studentContact)) errors.push({ key:"studentContact", label:"Student Contact Number", reason:"Must be 6–20 digits (+, -, spaces allowed)" });
 if (!phoneRegex.test(s.parentsContact)) errors.push({ key:"parentsContact", label:"Parents Contact Number", reason:"Must be 6–20 digits (+, -, spaces allowed)" });
 if (!phoneRegex.test(s.motherContact)) errors.push({ key:"motherContact", label:"Mother's Contact Number", reason:"Must be 6–20 digits (+, -, spaces allowed)" });
 if (s.birthDate) {
   const bd = new Date(s.birthDate), today = new Date();
   if (bd > today) errors.push({ key:"birthDate", label:"Birth Date", reason:"Cannot be a future date" });
 }
 if (errors.length > 0) { showValidationErrors(errors, "Please correct the following:"); return; }

 const btn = document.getElementById("formSubmitBtn");
 if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Saving...'; }

 if(mode==="admin"){
   if(editIndex!==null){
     const existing=students[editIndex];
     s.id=existing.id;
     const r = await apiPost({ action:"update", ...s });
     console.log("Update result:", r);
     showToast("Student record updated successfully.");
     editIndex=null;
   }else{
     s.id=Date.now().toString();
     const r = await apiPost({ action:"create", ...s });
     console.log("Create result:", r);
     showToast("Student registered successfully.");
   }
   await new Promise(r=>setTimeout(r,1500));
   await loadStudentsFromSheet();
   go("database");
 }else{
   const duplicate=students.some(x=>x.rollNo && s.rollNo && String(x.rollNo).toLowerCase()===s.rollNo.toLowerCase());
   if(duplicate){
     showValidationErrors([{key:"rollNo",label:"Roll No",reason:"This Roll No already exists. Please contact Admin."}], "Duplicate record:");
     if(btn){ btn.disabled=false; btn.textContent="Save Student"; }
     return;
   }
   s.id=Date.now().toString();
   const r = await apiPost({ action:"create", ...s });
   console.log("Student create result:", r);
   showToast("Student form submitted successfully.");
   await new Promise(r=>setTimeout(r,1500));
   await loadStudentsFromSheet();
   setTimeout(()=>{ goStudentForm(); },400);
 }
}

function showValidationErrors(items, title){
  const banner = document.getElementById("validationBanner");
  if (!banner) return;
  let html = `<strong>⚠️ ${esc(title)}</strong><ul>`;
  items.forEach(it => {
    const reason = it.reason ? ` — <em>${esc(it.reason)}</em>` : "";
    html += `<li><b>${esc(it.label)}</b>${reason}</li>`;
    const wrap = document.querySelector(`.field[data-field="${it.key}"]`);
    if (wrap) wrap.classList.add("has-error");
  });
  html += `</ul>`;
  banner.innerHTML = html;
  banner.className = "validation-banner show";
  const first = items[0];
  const el = document.getElementById("f_" + first.key) || document.querySelector(`.field[data-field="${first.key}"]`);
  if (el) {
    banner.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(()=> el.focus(), 250);
  }
}

function clearStudentForm(){
  document.querySelectorAll("[id^='f_']").forEach(x=>{ if(x.type !== 'file') x.value=""; });
  resetPhotoUI();
  clearValidation();
}
function goStudentForm(){page="studentForm";render();}

 const s=students[i];
 if(!s) return;
 let msg = Object.entries(s)
   .filter(([k])=>k!=="id" && k!=="photo")
   .map(([k,v])=>{
     if(k === "birthDate") return k + ": " + (formatDateDMY(v) || "-");
     return k + ": " + (v || "-");
   })
   .join("\n");
 msg += s.photo ? "\n\n[Photo attached]" : "\n\n[No photo]";
 alert(msg || "No information");
}
async function deleteStudent(i){
  const s=students[i];
  if(!s) return;
  if(!confirm("Delete this student record?")) return;
  await apiPost({ action:"delete", id: s.id });
  students.splice(i,1); render();
  await new Promise(r=>setTimeout(r,900));
  await loadStudentsFromSheet(); render();
  showToast("Student deleted.");
}

     <strong>Password Requirements:</strong>
     <ul style="margin:6px 0 0 18px;"><li>Minimum 6 characters</li><li>Must include at least one letter and one number</li></ul>
    </div>
    <div class="actions">
     <button class="btn btn-primary" id="cpBtn" onclick="updatePassword()">✓ Update Credentials</button>
     <button class="btn btn-light" onclick="go('dashboard')">Cancel</button>
    </div>
   </div>
  </div>
 </div>`;
}
async function updatePassword(){
  const current=document.getElementById("cp_current").value;
  const newUsername=document.getElementById("cp_username").value.trim();
  const newPass=document.getElementById("cp_new").value;
  const confirmPass=document.getElementById("cp_confirm").value;
  const errEl=document.getElementById("cpError");
  const sucEl=document.getElementById("cpSuccess");
  const btn=document.getElementById("cpBtn");
  errEl.textContent=""; sucEl.textContent="";
  if(current!==adminCredentials.password){ errEl.textContent="Current password is incorrect."; return; }
  if(newUsername && newUsername.length<3){ errEl.textContent="Username must be at least 3 characters long."; return; }
  if(!newPass){ errEl.textContent="New password cannot be empty."; return; }
  if(newPass.length<6){ errEl.textContent="New password must be at least 6 characters long."; return; }
  if(!/[a-zA-Z]/.test(newPass) || !/[0-9]/.test(newPass)){ errEl.textContent="New password must contain at least one letter and one number."; return; }
  if(newPass!==confirmPass){ errEl.textContent="New password and confirm password do not match."; return; }
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Updating...';
  const finalUser = newUsername || adminCredentials.username;
  await apiPost({ action:"saveCredentials", username: finalUser, password: newPass });
  adminCredentials.username = finalUser;
  adminCredentials.password = newPass;
  sucEl.textContent="Credentials updated successfully!";
  showToast("Admin credentials updated successfully.");
  btn.disabled=false; btn.textContent="✓ Update Credentials";
  document.getElementById("cp_current").value="";
  document.getElementById("cp_new").value="";
  document.getElementById("cp_confirm").value="";
}

/* ============ PRINT ENGINE ============ */
function printDatabase(){
  if(!students.length){ alert("No student records available to print."); return; }
  openPrintWindow(students, "", "Complete Student Database");
}
function printByClass(){
  const cls = document.getElementById("printClass").value;
  if(!cls){ alert("Please select a class first."); return; }
  const filtered = students.filter(s => String(s.className || "").toUpperCase() === cls.toUpperCase());
  if(!filtered.length){ alert("No students found for class: " + cls); return; }
  openPrintWindow(filtered, "Class - " + cls, "Class-wise Student List");
}
function printByYear(){
  const yr = document.getElementById("printYear").value;
  if(!yr){ alert("Please select an academic year first."); return; }
  const filtered = students.filter(s => String(s.academicYear || "") === yr);
  if(!filtered.length){ alert("No students found for academic year: " + yr); return; }
  openPrintWindow(filtered, "Year - " + yr, "Year-wise Student List");
}

function openPrintWindow(list, filterLabel, title){
  const name = (s) => [s.firstName, s.middleName, s.lastName].filter(Boolean).join(" ");
  const withPhoto = document.getElementById("printWithPhoto")?.checked ?? true;

  const rows = list.map(s => `
    <tr>
      ${withPhoto ? `<td class="photo-cell">${s.photo ? `<img src="${esc(s.photo)}" alt="Photo" class="print-photo" crossorigin="anonymous">` : "—"}</td>` : ""}
      <td>${esc(s.academicYear)}</td>
      <td>${esc(s.rollNo)}</td>
      <td>${esc(s.enrollmentNo)}</td>
      <td>${esc(name(s))}</td>
      <td>${esc(s.gender)}</td>
      <td>${esc(s.studentCategory)}</td>
      <td>${esc(formatDateDMY(s.birthDate))}</td>
      <td>${esc(s.className)}</td>
      <td>${esc(s.studentContact)}</td>
      <td>${esc(s.parentsContact)}</td>
      <td>${esc(s.motherContact)}</td>
      <td>${esc(s.email)}</td>
      <td>${esc(s.bloodGroup)}</td>
      <td>${esc(s.currentAddress)}</td>
      <td>${esc(s.permanentAddress)}</td>
    </tr>`).join("");

  const headerCells = `
    ${withPhoto ? `<th>Photo</th>` : ""}
    <th>Academic Year</th><th>Roll No</th><th>Enrollment No</th><th>Name</th><th>Gender</th>
    <th>Category</th><th>Birth Date</th><th>Class</th><th>Student Contact</th>
    <th>Parents Contact</th><th>Mother Contact</th><th>Email</th><th>Blood Group</th>
    <th>Current Address</th><th>Permanent Address</th>`;

  const filterLine = filterLabel ? filterLabel : "";
  const photoNote = withPhoto ? "" : " (Without Photo)";

  const printWindow = window.open("", "_blank", "width=1200,height=800");
  if(!printWindow){ alert("Please allow pop-ups in your browser to print the database."); return; }

  printWindow.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>JSPM Student Database — ${esc(title)}${photoNote}</title>
      <style>
        @page{size:A4 landscape;margin:10mm}
        *{box-sizing:border-box}
        body{font-family:Arial,Helvetica,sans-serif;color:#000;margin:0;background:#fff}
        .print-header{text-align:center;margin-bottom:14px;line-height:1.5}
        .print-header h1{font-size:18px;margin:0;letter-spacing:0.5px;font-weight:bold}
        .print-header .line2{font-size:13px;margin:0;font-weight:normal}
        .print-header .line3{font-size:13px;margin:0;font-weight:normal}
        .print-header .line4{font-size:13px;margin:4px 0 0;font-weight:bold}
        table{width:100%;border-collapse:collapse;font-size:${withPhoto ? 8 : 8.5}px;margin-top:6px;table-layout:fixed}
        th,td{border:1px solid #333;padding:4px 3px;text-align:left;vertical-align:top;word-break:break-word}
        th{font-weight:bold;background:#e5e7eb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
        thead{display:table-header-group}
        tr{page-break-inside:avoid}
        .photo-cell{text-align:center;vertical-align:middle;width:55px}
        .print-photo{width:45px;height:45px;object-fit:cover;border:1px solid #333;border-radius:3px;display:block;margin:auto}
        .print-footer{margin-top:10px;font-size:9px;display:flex;justify-content:space-between}
        @media print{
          th,td,.print-photo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
        }
      </style>
    </head>
    <body>
      <div class="print-header">
        <h1>JAYAWANTRAO SAWANT POLYTECHNIC</h1>
        <p class="line2">Hadapsar, Pune</p>
        <p class="line3">Computer Engineering</p>
        ${filterLine ? `<p class="line4">${esc(filterLine)}${photoNote}</p>` : (photoNote ? `<p class="line4">${photoNote.trim()}</p>` : "")}
      </div>

      <table>
        <thead>
          <tr>${headerCells}</tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>

      <div class="print-footer">
        <span>Printed on: ${new Date().toLocaleString("en-IN")}</span>
        <span>Total Records: ${list.length}</span>
      </div>
    </body>
    </html>
  `);
  printWindow.document.close();
  printWindow.focus();

  if(!withPhoto){
    setTimeout(() => {
      try { printWindow.print(); } catch(e){}
      setTimeout(()=>{ try { printWindow.close(); } catch(e){} }, 500);
    }, 400);
    return;
  }

  const imgs = printWindow.document.querySelectorAll(".print-photo");
  let loaded = 0;
  const total = imgs.length;
  let printed = false;
  const triggerPrint = () => {
    if(printed) return;
    printed = true;
    try { printWindow.print(); } catch(e){}
    setTimeout(()=>{ try { printWindow.close(); } catch(e){} }, 500);
  };

  if(total === 0){
    setTimeout(triggerPrint, 400);
  } else {
    imgs.forEach(img => {
      if(img.complete && img.naturalWidth > 0){
        loaded++;
        if(loaded === total) setTimeout(triggerPrint, 400);
      } else {
        img.addEventListener("load", () => {
          loaded++;
          if(loaded === total) setTimeout(triggerPrint, 400);
        });
        img.addEventListener("error", () => {
          loaded++;
          if(loaded === total) setTimeout(triggerPrint, 400);
        });
      }
    });
    setTimeout(triggerPrint, 12000);
  }
}
